<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>歴史総合 授業アーカイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style id="css">
/* Layout: 白黒基調。上端に黒い罫線つきの見出し（騎馬武者のシルエットと年表の目盛り）→連絡事項→章ジャンプと検索→章ごとの講カード。赤は「重要・NEW・いま」だけに使う。 */
:root{
  --bg:#F6F6F6; --surface:#FFFFFF; --ink:#111111; --muted:#5E5E5E; --line:#D9D9D9;
  --accent:#111111; --accent-soft:#EDEDED; --on-accent:#FFFFFF;
  --done:#1E7A4F; --done-soft:#E3F3EA; --new:#C8322A; --danger:#B23A3A; --mark:#FFE58A;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --r:12px; --art:none; --map-land:#C9C9C9;
  --f-his:"Anton","Impact","Arial Narrow Bold","Haettenschweiler",sans-serif;
  --f-title:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --hero-bg:#111111; --hero-edge:#111111;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#181818; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --accent:#F2F2F2; --accent-soft:#262626; --on-accent:#111111;
  --done:#62CF98; --done-soft:#183126; --new:#F0705F; --danger:#F08A8A; --mark:#6B5A12; --art:invert(1); --hero-bg:#000000; --hero-edge:#333333; --map-land:#4A4A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#181818; --ink:#F2F2F2; --muted:#A8A8A8; --line:#333333;
  --accent:#F2F2F2; --accent-soft:#262626; --on-accent:#111111;
  --done:#62CF98; --done-soft:#183126; --new:#F0705F; --danger:#F08A8A; --mark:#6B5A12; --art:invert(1); --hero-bg:#000000; --hero-edge:#333333; --map-land:#4A4A4A; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:16px 100px}
.chap,.cnav a,.hit,.dash{--c:var(--ink);--c-soft:var(--accent-soft);--c-line:var(--line);--c-ink:var(--surface)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);border:1px solid var(--hero-edge);color:#FFFFFF;border-radius:6px;padding:20px 22px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.hero-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .kicker{font-size:11px;letter-spacing:.28em;color:#9A9A9A;font-weight:700}
.hero .jp{font-family:var(--f-title);font-weight:800;font-size:clamp(18px,4.4vw,24px);letter-spacing:.18em;display:flex;align-items:center;gap:10px}
.seal{width:24px;height:24px;background:#C8322A;color:#FFFFFF;font-family:var(--f-title);font-weight:800;font-size:14px;display:grid;place-items:center;border-radius:3px;transform:rotate(-4deg);letter-spacing:0}
.his{position:relative;z-index:2;margin-top:18px;min-width:0;font-family:var(--f-his);font-weight:400;font-size:min(17.5vw,196px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:flex-end;white-space:nowrap}
.his .w2{color:transparent;-webkit-text-stroke:2px #FFFFFF;paint-order:stroke}
.his .gap{display:inline-block;width:.32em;align-self:stretch;position:relative}
.his .gap::before{content:"";position:absolute;left:50%;top:6%;bottom:4%;width:.07em;transform:translateX(-50%);background:#E0453A}
@media (prefers-reduced-motion:no-preference){
  .his .gap{animation:split 1.4s cubic-bezier(.7,0,.2,1) .35s both}
  .his .gap::before{animation:caret 1.1s steps(1) 1.7s 3}
}
@keyframes split{from{width:0}to{width:.32em}}
@keyframes caret{50%{opacity:0}}
.motto{position:relative;z-index:2;margin-top:14px;display:grid;gap:6px;max-width:44ch}
.motto .en{font-size:clamp(14px,3.6vw,17px);letter-spacing:.04em;color:#FFFFFF}
.motto .en em{font-style:normal;color:#FF7A6B;font-weight:700}
.motto .ja{display:flex;align-items:center;gap:12px;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;font-size:clamp(11px,2.9vw,13px);letter-spacing:.32em;color:#D6D6D6;line-height:1.6}
.motto .ja::before{content:"";width:28px;height:1px;background:#E0453A;flex:none}
.hero .hello{position:relative;z-index:2;margin-top:10px;justify-self:start;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.6);padding:3px 12px;border-radius:999px}
.hero .hello b{color:#FF7A6B}
.hero-art{position:relative;display:block;margin:6px -22px 0;width:calc(100% + 44px);height:auto;max-height:170px;color:#EDEDED;opacity:.55;pointer-events:none}
.hero-art .hole{fill:var(--hero-bg)}
.notice{margin-bottom:16px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r);white-space:pre-wrap}
/* 連絡事項 */
.news{position:relative;z-index:1;margin:16px 0 4px;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px}
.news h2{font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.news h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--new);box-shadow:0 0 0 4px color-mix(in srgb,var(--new) 20%,transparent)}
.news h2 small{font-size:12px;font-weight:500;color:var(--muted)}
.nitem{display:grid;grid-template-columns:3.6em 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.nitem:first-of-type{border-top:0}
.nitem time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.nitem .nt{font-weight:700;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0}
.nitem .nb{grid-column:2;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.nitem .nb a{color:var(--accent)}
.nitem.imp{background:color-mix(in srgb,var(--new) 8%,var(--surface));border-radius:8px;padding-inline:8px;margin-inline:-8px;border-top-color:transparent}
.tag.imp{background:var(--new);color:var(--surface)}
.nmore{justify-self:start;margin-top:4px;background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:700}
.nempty{font-size:13px;color:var(--muted)}
.nedit{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}

/* top cards */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.label{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.now .label{color:var(--on-accent);opacity:.8}
.now h2{font-size:20px;line-height:1.4}
.now h2 small{display:block;font-size:13px;font-weight:500;opacity:.85}
.now .mats a,.now .mats .mat{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.now .none{color:var(--on-accent);opacity:.85}
.now .jump{font-size:13px;color:var(--on-accent)}
/* 時間軸・空間軸（講カード） */
.axis{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.amap{width:132px;height:auto;display:block;color:var(--map-land)}
.amap .dot{fill:var(--new);stroke:var(--surface);stroke-width:2}
.amap .ring{fill:none;stroke:var(--new);stroke-width:1.2;opacity:.45}
.ainfo{display:grid;gap:5px;min-width:0}
.aline{display:flex;align-items:baseline;gap:6px;font-size:12px;min-width:0}
.aline b{font-size:10px;letter-spacing:.12em;color:var(--muted);flex:none;width:2.6em}
.ayr{font-weight:900;font-variant-numeric:tabular-nums;font-size:13px}
.aplace{color:var(--ink);overflow-wrap:anywhere}
.aband{position:relative;height:16px;margin:0 2px}
.aband .trk{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.aband .seg{position:absolute;top:3px;height:10px;background:var(--ink);border-radius:2px;min-width:4px}
.aband .tk{position:absolute;top:4px;width:1px;height:8px;background:var(--muted);opacity:.6}
.aticks{position:relative;height:11px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 2px}
.aticks span{position:absolute;transform:translateX(-50%)}
.aticks span:first-child{transform:none}
.aticks span:last-child{transform:translateX(-100%)}
.ascale{display:flex;gap:4px;flex-wrap:wrap}
.ascale span{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ascale span.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
@media (max-width:360px){.axis{grid-template-columns:104px minmax(0,1fr)}.amap{width:104px}}
.atl{grid-column:1/-1;display:grid;gap:1px}
/* 用語 */
.terms{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;font-size:12px;border-top:1px dashed var(--line);padding-top:10px}
.terms b{font-size:11px;color:var(--muted);margin-right:2px;letter-spacing:.06em}
.terms span{background:var(--accent-soft);color:var(--ink);padding:2px 8px;border-radius:999px}
/* upload (edit mode) */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;justify-items:start;font-size:13px;color:var(--muted);background:var(--surface)}
.drop.over,.drop:focus{border-color:var(--ink);outline:none;background:var(--accent-soft)}
.drop .btn{cursor:pointer}
.upl input{display:none}
/* original-file save */
.mats .mat small{font-size:10px;font-weight:700;opacity:.75;margin-left:2px}
.mats .dl{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.mats .dl:hover{border-color:var(--accent);color:var(--accent)}
.now .mats .dl{background:transparent;color:var(--on-accent);border-color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;max-width:calc(100% - 32px);text-align:center}

/* pdf viewer */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.vbar strong{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar span{font-size:12px;color:var(--muted);white-space:nowrap}
.vzoom{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:34px;height:32px;font-size:16px;font-weight:700}
.vclose{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px}
.vpages{flex:1;overflow:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:12px;align-content:start}
.vpages{justify-items:safe center}
.vpages canvas{display:block;width:calc(min(100%,820px) * var(--z,1));max-width:none;height:auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.15);border-radius:2px}
.vmsg{padding:40px 16px;text-align:center;color:var(--muted)}

/* pin gate */
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:min(100%,360px);display:grid;gap:14px;text-align:center}
.gate h1{font-size:26px;font-weight:900}
.gate p{color:var(--muted);font-size:14px}
.gate input[type=password]{font-size:24px;letter-spacing:.4em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.gate .err{color:var(--danger);font-size:13px;min-height:1.2em}
.gate .btn.pri{padding:10px;font-size:15px}
.gate .chk{justify-content:center}

/* search results */
.results{margin-top:12px;display:grid;gap:8px}
.results .rhead{font-size:13px;color:var(--muted)}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;min-width:0}
.hit .ht{font-weight:700;text-decoration:none;color:var(--ink)}
.hit .ht small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.hit .why{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}

/* nav */
.cnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:24px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.cnav a{flex:none;text-decoration:none;font-size:13px;font-weight:700;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap;display:flex;align-items:center;gap:6px}
.cnav a b{font-family:var(--f-display);font-weight:400;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--c);color:var(--c-ink)}
.cnav a:hover{border-color:var(--c)}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.search{flex:1 1 240px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* chapters */
.chap{margin-top:36px;scroll-margin-top:64px}
.chead{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 14px;margin-bottom:14px;padding:0 0 12px;border-bottom:2px solid var(--ink)}
.cbadge{grid-row:span 2;font-family:var(--f-display);font-size:24px;width:52px;height:52px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--c-ink)}
.chead .cl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.chead h2{font-size:clamp(18px,4.5vw,22px);font-weight:900;line-height:1.3}
.chead .era{font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
.chead .prog{margin-left:auto;font-size:12px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}

/* lesson */
.lesson{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:12px;align-content:start;min-width:0;scroll-margin-top:70px;transition:box-shadow .15s,transform .15s}
.lesson:hover{box-shadow:0 6px 18px rgba(0,0,0,.08)}
.lesson.is-current{box-shadow:0 0 0 2px var(--c,var(--accent))}
.lhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lno{font-size:11px;font-weight:700;color:var(--c,var(--accent));background:var(--c-soft,var(--accent-soft));padding:1px 8px;border-radius:999px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.tag.cur{background:var(--accent);color:var(--on-accent)}
.tag.new{background:var(--new);color:var(--surface)}
.ltitle{font-weight:900;font-size:17px;line-height:1.45;width:100%}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats a,.mats span,.mats .mat{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--c,var(--accent));color:var(--c-ink);background:var(--c,var(--accent));text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.mats a:hover,.mats .mat:hover{filter:brightness(1.08);transform:translateY(-1px)}
.mats a.seen::after,.mats .mat.seen::after{content:"✓";font-size:11px;opacity:.9}
.mats a.isnew::before,.mats .mat.isnew::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--new)}
.mats span.later{border-style:dashed;border-color:var(--line);color:var(--muted);background:transparent;font-weight:500}
.none{font-size:13px;color:var(--muted)}
.lfoot{display:flex;justify-content:flex-end}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.foot{margin-top:56px;font-size:12px;color:var(--muted);text-align:center;display:grid;gap:4px}

/* edit */
.editbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.savebar .st{font-size:13px;flex:1 1 200px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.del{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.in{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.ebox{display:grid;gap:8px}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.erow > .grow{flex:1 1 180px}
.erow > .narrow{flex:0 0 6.5em}
.etypes{display:grid;gap:6px}
.etypes details{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.etypes summary{cursor:pointer;font-size:13px}
.etypes summary small{color:var(--muted);margin-left:6px}
.flist{display:grid;gap:4px;margin:8px 0;font-size:13px}
.flist div{display:flex;gap:6px;align-items:center;min-width:0}
.flist span{flex:1;min-width:0;overflow-wrap:anywhere}
.edithead{margin-bottom:16px;padding:14px;border:2px dashed var(--accent);border-radius:12px;display:grid;gap:8px;background:var(--surface)}
.edithead label.lb{font-size:12px;color:var(--muted)}
.banner{margin-bottom:12px;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px;align-items:center}

        "file": "files/c6l1-print.pdf",
        "fn": "大正デモクラシーと護憲運動_プリント.pdf",

        "t": "大正時代の日本 教 113 ｐ－\n大正デモクラシーと護憲運動\n１．大正デモクラシーとは何だろう\n① 大正時代前期：第 1 次護憲運動の時期（内閣：西園寺、桂、山本）\n② 大正時代中期：第 1 次世界大戦の時期（内閣：大隈、寺内、原）\n③ 大正時代後期：第 2 次護憲運動の時期（内閣：清浦、加藤）\n西園寺公望内閣\n２個師団増設問題 …陸軍が朝鮮に陸軍部隊（師団）を二つ増やして軍備拡張を要求\n↓\n西園寺 「今は日露戦争でお金を使いすぎたので、財政難です。軍備拡張は諦めてください。」\n↓\n陸軍大臣「認めないなら、陸軍大臣を辞めてやる！」⇨ 新しい陸軍大臣がなかなか決まらなかった\nなぜ決まらない？ ⇨軍部大臣現役武官制：陸軍大臣と軍大臣は現役の武官でなければならない\n↓\n陸軍に嫌われた西園寺内閣は、大臣が決まらず潰れてしまった！\n桂太郎内閣\n宮中（天皇を支える立場）の人間で、陸軍にも影響力を持つ桂太郎が推薦された（力のある元老などから）\n↓\n今まで：宮中は政治に直接干渉しないという慣習があった（天皇の力を後ろ盾に権力が集中するから）\n↓\n国民「今までの慣習を無視するなんてあり得ない。軍部が気に入らない内閣を潰せてしまうのはダメだ！」\n↓\n第一次 護憲 運動 立憲国民党の犬養毅や立憲政友会の尾崎幸雄などが憲法に基づいた政治を求める運動\n⇨商工業者や都市の民衆もこの運動に参加し、桂内閣は 50 日で退陣\nポイント：大衆運動（大正デモクラシー）によって内閣が倒れたことは日本憲政史上初\n⇨ 政党 を中心とした政治運動が進んだ\n資料 桂首相を批判する尾崎行雄\n彼らは忠君愛国を、まるで自分の専売のように唱えているが、常に玉座 （天皇の席）の蔭（かげ）に隠れ、\n政敵を狙撃するかのような行動をとっているのである。…彼らは玉座をもって胸壁（きょうへき）となし、\n詔勅（しょうちょく）を弾丸として政敵を倒そうとしている。\n山本権兵衛内閣 …立憲政友会を与党とした内閣\n現役武官制を改正：現役の武官でなくてもいいように変えなければ！\n↓\nシーメンス事件\nドイツのシーメンス社が日本海軍に賄賂を渡して販売していた\n↓\n山本は海軍出身であり、責任をとって辞任\n大隈重信内閣 …立憲同士会を与党とした内閣\n第一次世界大戦が始まり、日英同盟を理由に参戦\n↓\n氏名＿＿＿＿＿＿＿＿＿\n中国に二十一ヶ条の要求を突きつける\n元老が反発：こんな要求突きつけたら、国際社会から日本が非難されてしまうだろ！ →大隈内閣 退陣…\n寺内正毅内閣 …超然内閣（政党の意見を聞き入れない内閣のこと）\n中国での権益拡大を狙う（大隈と同じく）\n↓\n1918 年： シベリア出兵 開始 ⇨ 米 の値段が急騰\nシベリアに出兵した兵隊の食料を政府が用意しなければならない\n米が買い占められ、米は品薄状態に…\n↓\n富山県の漁村の主婦が米屋に押しかける\n↓\n暴動は全国へ！＝ 米騒動◯\n↓\n寺内は米騒動に軍隊を使って鎮圧したが、非難殺到 →寺内内閣 退陣…\n原敬内閣 …立憲政友会の党員で固めた初の本格的な 政党 内閣（陸海空軍の３大臣以外の官僚）\n↓\n国民の期待大 ⇨政党内閣だから、国民の意見を反映させてくれるはず。普通選挙の実現も期待できる！\n◯吉野作造 民本主義：天皇に統治権があることを前提とし、天皇は民衆の意向に基づく政治を行う\n◯美濃部達吉 天皇機関説：天皇を国家の最高機関に置きながら、民衆の意向に基づく政党政治を実現\nしていくべきであるという考え方\n資料\n所謂機関説と申しまするのは、国家それ自身を一つの生命あり、それ自身に目的を有する恒久的の団体、即ち\n法律学上の言葉を以てせば一つの法人と観念いたしまして、天皇は此の法人たる国家の元首たる地位に在し\nまし、国家を代表して国家の一切の権利を総攬し給ひ、天皇が憲法に従つて行はせられまする行為が、即ち国\n家の行為たる効力を生ずると云ふことを云ひ表はすものであります。\nQ1 史料の中で、天皇の行為が「国家の行為」になる条件が書かれた部分に線を引こう\nQ2 美濃部の考えに近いのはどっち？ ア：天皇は憲法より上にいる イ：天皇も憲法に従う\nQ3 「イ」の考えが攻撃されたのはなぜだろう？\n★原敬が総理大臣になったことで、普通選挙運動が大盛り上がり\n↓\nしかし、労働運動・農民運動・社会主義運動がこれ以上盛り上がってしまう\n↓\n普通選挙の実現は叶わなかったが、納税要件を緩和させて、有権者数を増加させた\nデモクラシーの高揚\n大正デモクラシーの盛り上がりを受けて起こった運動を見てみよう\n「労働運動」\n 達吉\n考えよう\nQ1　史料の中で、天皇の行為が「国家の行為」になる条件が書かれた部分に線を引こう\nQ2　美濃部の考えに近いのはどっち？\n　　ア：天皇は憲法より上にいる　　イ：天皇も憲法に従う\nQ3　「イ」の考えが攻撃されたのはなぜだろう？\n原敬内閣\n★原敬が総理大臣になったことで、普通選挙運動が大盛り上がり\nしかし、労働運動・農民運動・社会主義運動がこれ以上盛り上がってしまう\n普通選挙の実現は叶わなかったが、納税要件を緩和させて、有権者数を増加させた\nデモクラシーの高揚\n大正デモクラシーの盛り上がりを受けて起こった運動を見てみよう\n「労働運動」\n1919年、国際労働機関（ILO）が設立された。これは労働問題を国際的に協議する国際連盟の姉妹機関のようなもの。\n賃上げや労働条件の改善を訴え、日本でも労働争議が多発。1920年には第1回メーデーが開催され、1921年には日本労働総同盟が結成。\n労働争議の発生件数と参加人数\nデモクラシーの高揚\n「農民運動」\n農村では小作料の減免を受ける小作争議が頻発。1922年には日本農民組合が結成。\n政府は農民の声に応える形で、1924年に小作調停法を制定し、小作人の権利を拡大。\n小作争議の発生件数と参加人数\n比べてみよう\n＜労働争議と小作争議の発生件数と参加人数を比較してみよう！＞\n労働争議\n小作争議\nデモクラシーの高揚\n「女性運動」\n1911年、平塚らいてうが青鞜社を結成したが、これは女性の権利を求める運動というより、文学がメインの団体だった。\n第一次世界大戦がきっかけで、女性の社会進出が拡大。1920年、市川房枝らが新婦人協会を創設。\n新婦人協会（平塚・市川）\nデモクラシーの高揚\n「女性運動」（つづき）\n新婦人協会の設立もあって、1922年、治安警察法が改正され、女性の政治演説会の参加が認められるようになった。\n1924年には婦人参政権獲得期成同盟会が結成されたが、女性参政権の獲得は戦後まで待つことになった。\n『青鞜』創刊の辞（平塚らいてう）「元始、女性は実に太陽であった。」\n補足\nデモクラシーの高揚\n「社会主義運動」\n1922年、コミンテルンの日本支部の日本共産党が結成。堺利彦、山川均らによって作られた。\n「全国水平社」\n1922年3月3日、部落差別を受け、苦しめられてきた人々約3000人が京都に集まり、自らの力による差別からの解放と、人間としての平等と自由の獲得をめざす全国水平社を創立した。\n水平社宣言の結び「人の世に熱あれ、人間に光あれ。」\n補足\n大正時代の経済\n日本は空前の好景気に沸いていた　なぜ？？\n◯第一次世界大戦によって、交戦中のヨーロッパからアジアへの輸出が止まったから\n＞アジアで日本の輸出が拡大　重化学工業・繊維業・造船業が急成長\n　貿易収支は大幅黒字「大戦景気」\n＞ヨーロッパが市場に戻ってきた　大戦が終わると大戦景気はSTOPし、\n　日本は戦後恐慌になってしまった\n関東大震災\n1923年9月1日午前11時58分　関東地方を中心に巨大地震が発生。\n地震そのものの死者よりも火災による死者の方が多く、死者は10万人を超えた。\n★1920年代前半は、戦後恐慌　⇨　震災恐慌　と恐慌が続く時代\n混乱の中で流言が広がり、多くの朝鮮人や中国人が殺害された\n補足\n清浦奎吾内閣\n…超然内閣（政党も国民も無視）\nなぜ？？\n関東大震災による社会不安の中、人々に自由を与えると何をするかわからないと考えたから\nみんなの意見を無視して政治をやったことで、結果的に周りを怒らせた\n護憲三派による第二次護憲運動が始まった\n護憲三派\n◯護憲三派とは？？\n第二次護憲運動をやっていた3つの政党のこと。\n立憲政友会の高橋是清\n憲政会の加藤高明\n革新倶楽部の犬養毅\n一方、清浦も政友本党を作ってこの流れに対抗\n総選挙は護憲三派の圧勝\n…第二次護憲運動によって政権交代が実現した\n犬養・高橋・加藤\n加藤高明内閣\n★◯普通選挙法を制定\n満25歳以上の男性全員に無条件で選挙権が与えられた\n★◯治安維持法を制定\n社会主義運動や労働運動を抑えるため\n考えよう\n原内閣\n「原内閣が普通選挙を実現できなかった理由を思い出そう」\n普通選挙の実施による、労働運動・農民運動・社会主義運動などの運動の盛り上がりを危惧　→断念\n加藤内閣\n「加藤内閣はなぜ実現できた？」\n普通選挙法とセットで運動を弾圧する法令（治安維持法）も出して、運動が盛り上がりすぎないようにした\n加藤高明内閣\n治安維持法を制定した理由はもう一つ！\nこの年、日本はソ連と国交を樹立　→日ソ基本条約\n国\n国内　「 選挙は\nまだ早い…\n原敬\nえーっ！\nせいや\n労働運動・農民運動・社会主義運動が盛り上がりすぎるのを心配。\n納税の条件をゆるめて\n有権者を増やすだけにした。\n5\n吉野作造の「民本主義」\n天皇主権が前提。\nでも政治は\n民衆の意向で！\n吉野作造\nれっきーの解説\n「天皇をやめろ」ではなく、天皇のもとで\n民衆のための政治をしよう！という考えニャ\n6\n美濃部達吉の「天皇機関説」\n天皇は国家の\n最高機関。\n天皇も憲法に従う！\n美濃部達吉\nプリントのQ2を考えよう！\n美濃部の考えに近いのは ア・イ どっち？\n7\nデモクラシーの高まり　いろんな人が声をあげた！\n労働運動\n賃上げを！\n1919\n国際労働機関（ILO）\n1920　第1回\nメーデー\n1921　日本労働総同盟\n農民運動\n小作料を\n下げて！\n小作争議\nが多発\n1922　日本農民組合\n1924　小作調停法\n女性運動\n女性にも\n参政権を！\n1911\n平塚らいてう\n（青鞜社）\n1920\n新婦人協会\n（市川房枝ら）\n参政権は戦後まで…\n全国水平社\n差別からの\n解放を！\n1922年3月3日\n京都に約3000人\n人間の平等と自由をめざす\nさらに1922年、\n日本共産党\nが結成（堺利彦・山川均ら）→ 社会主義運動も高まる\n8\n大戦景気 → 戦後恐慌\n大戦景気\n恐慌\n1914\n1920\nジェットコースター\nみたい！\nせいや\nヨーロッパが戦争中でアジアに輸出できない → 日本の輸出が急増！\n重化学工業・繊維・造船\nが急成長。でも戦後は\n戦後恐慌\nに。\n9\n1923年9月1日　関東大震災\n午前11時58分、関東で巨大地震。地震より\n火災\nの死者が多く、死者は\n10万人以上\n。\n1920年代前半は\n戦後恐慌 → 震災恐慌\nと不況が続く\n第4話\n歴史総合　大正デモクラシーと護憲運動\nついに普通選挙！…でも？\n1\n1924年　清浦奎吾内閣\n震災で社会不安だ。\n自由を与えたら\n何をするかわからん！\n清浦奎吾\nれっきーの解説\n政党も国民も無視する\n超然内閣\nの復活ニャ…\n2\n国民の怒りが爆発\n政党も国民も\n無視するな！\n国民\n清浦も\n政友本党\nをつくって対抗！\n3\n第二次護憲運動　「護憲三派」が立ち上がる！\n立憲政友会、\n参加する！\n高橋是清（立憲政友会）\n政党内閣を\n取りもどせ！\n加藤高明（憲政会）\n革新倶楽部も\nいくぞ！\n犬養毅（革新倶楽部）\n犬養さん、\n第1話にも\n出てた！\nせいや\n4\n総選挙の結果は…\n投票\n選挙で政権が\nかわったニャ！\nれっきー\n護憲三派の圧勝！\n運動によって\n政権交代\nが実現\n5\n1925年　加藤高明内閣の「アメ」\n普通選挙法\n満25歳以上の\n男性全員に\n選挙権じゃ！\n加藤高明\nやったー！\nお金の条件も\nなしだ！\nせいや\n6\n…あれ？\n待って、\n女性は…？\n?\nせいや\n女性の参政権は\n戦後まで\nおあずけニャ…\nれっきー\n第3話の女性運動（平塚らいてう・市川房枝）を思い出そう！\n7\n同じ年の「ムチ」\n治安維持法\nただし…\n社会主義運動や\n労働運動は取りしまる！\n加藤高明\n8\nなぜ「アメ」と「ムチ」をセットにしたの？\nソ連と国交を結んだし\n（日ソ基本条約）、\n社会主義が広がったら困る…\n加藤高明\nれっきーの解説\n普選で労働者も投票できる → 運動が盛り上がりすぎるかも。\n社会主義の国・ソ連を認めた → 共産主義が広がるかも。\nだから\n治安維持法でブレーキ\nをかけたニャ！\nまとめ\n原敬と加藤高明、何がちがった？\n原敬内閣\n運動の盛り上がりを心配して普通選挙は\n断念\n。納税条件をゆるめただけ。\n加藤高明内閣\n普通選挙法と\n治安維持法をセット\nにして普選を実現！\nその後\n小作農や労働者を支持基盤にする\n無産政党\nが生まれた。\n国民の声が政治を動かした！\nでも、自由をおさえる法律も\n生まれたんだね…\nせいや\nきみは、この時代を\nどう評価する\nニャ？\nれっきー"
       }
      ]

<script id="main">
(function(){

var PAGE_TITLE='歴史総合 授業アーカイブ';

var DEFAULT_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var TYPES=[
  {k:'print',s:'プリント',name:'授業プリント'},
  {k:'slide',s:'スライド',name:'スライド'},
  {k:'note',s:'ノート解答',name:'歴史ノート解答'},
  {k:'review',s:'復習要点',name:'復習要点プリント'},
  {k:'practice',s:'練習問題',name:'練習問題'},
  {k:'manga',s:'漫画',name:'漫画'},
  {k:'exam',s:'入試チャレンジ',name:'入試チャレンジ'}
];
var GATE_KEY='rekishi-gate', DRAFT_KEY='rekishi-draft', STORE_KEY='rekishi-student-v1', NEW_DAYS=14;

var saved=JSON.parse(document.getElementById('site-data').textContent);
var state=clone(saved);
var edit=false, canWrite=false, dirty=false, art=null, busy=false;
var expanded={}, query='', onlyHas=false, pendingDel=null, status='', restore=null;

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var TODAY=ymd(new Date());
function daysAgo(s){var t=Date.parse(s+'T00:00:00');return isNaN(t)?1e9:Math.floor((Date.parse(TODAY+'T00:00:00')-t)/864e5)}
function files(l,k){return (l.items&&l.items[k])||[]}
function hiddenT(l,k){return !!(l.hidden&&l.hidden[k])}
function visibleTypes(l){return TYPES.filter(function(t){return files(l,t.k).length&&!hiddenT(l,t.k)})}
function isNewFile(f){return !!(f.d&&daysAgo(f.d)<=NEW_DAYS)}
function allLessons(){var a=[];state.chapters.forEach(function(c,ci){c.lessons.forEach(function(l,li){a.push({c:c,l:l,ci:ci,li:li})})});return a}
function findLesson(id){var a=allLessons();for(var i=0;i<a.length;i++)if(a[i].l.id===id){a[i].i=i;return a[i]}return null}
function tgt(){return 'target="_blank" rel="noopener"'}
function pinHash(pin){var s='rekishi-sogo:'+pin,h=2166136261;for(var r=0;r<3;r++)for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return ('0000000'+h.toString(16)).slice(-8)}
var gateOk=false, gateErr='';
try{gateOk=!!state.course.pin&&localStorage.getItem(GATE_KEY)===state.course.pin}catch(e){}
function locked(){return !!state.course.pin&&!gateOk&&!canWrite}
function gateHtml(){
  return '<div class="gate"><form id="gate" autocomplete="off"><h1>'+esc(state.course.title)+'</h1><p>暗証番号を入力してください</p>'+

    '<div class="err" role="alert">'+esc(gateErr)+'</div>'+
    '<label class="chk"><input id="remember" type="checkbox" checked> この端末では次回から入力しない</label>'+
    '<button class="btn pri" type="submit">入る</button></form></div>';
}

/* ---------- per-student record (this browser only) ---------- */
function loadStore(){try{var s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');return s&&typeof s==='object'?s:{}}catch(e){return {}}}
var S=loadStore(); S.done=S.done||S.stamps||{}; S.seen=S.seen||{}; delete S.quiz;
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
var prevVisit=S.last||null, newSince=0;
if(prevVisit&&prevVisit<TODAY){allLessons().forEach(function(x){if(!x.l.open)return;TYPES.forEach(function(t){if(hiddenT(x.l,t.k))return;files(x.l,t.k).forEach(function(f){if(f.d&&f.d>prevVisit)newSince++})})})}
S.last=TODAY; persist();
try{var dr=sessionStorage.getItem(DRAFT_KEY);if(dr)restore=JSON.parse(dr)}catch(e){}
function doneCount(c){var n=0;c.lessons.forEach(function(l){if(S.done[l.id])n++});return n}

/* ---------- search ---------- */
function kata(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\u3041-\u3096]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+96)})}
function norm(s){return kata(s).replace(/[\s・=＝ー\-‐、,。「」（）()]/g,'')}
function hl(text,q){var lt=kata(text),lq=kata(q).trim(),i=lq?lt.indexOf(lq):-1;if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+lq.length))+'</mark>'+esc(text.slice(i+lq.length))}
function snippet(t,q){var lt=kata(t),lq=kata(q).trim(),i=lq?lt.indexOf(lq):-1;if(i<0)return '';var a=Math.max(0,i-24),b=Math.min(t.length,i+lq.length+30);return (a?'…':'')+hl(t.slice(a,b),q)+(b<t.length?'…':'')}
function search(q){
  var nq=norm(q); if(!nq) return [];
  var out=[];
  allLessons().forEach(function(x){
    var l=x.l,score=0,why=[];
    if(norm(l.title).indexOf(nq)>=0){score=3;why.push('タイトル：'+hl(l.title,q))}
    var kws=(l.kw||[]).concat(l.terms||[]).filter(function(k){return norm(k).indexOf(nq)>=0});
    if(kws.length){score=Math.max(score,2);why.push('キーワード：'+kws.slice(0,5).map(function(k){return '<mark>'+esc(k)+'</mark>'}).join('、'))}
    if(l.open) TYPES.forEach(function(t){if(hiddenT(l,t.k))return;files(l,t.k).forEach(function(f){if(f.t&&norm(f.t).indexOf(nq)>=0){score=Math.max(score,1);why.push(esc(t.s)+'の本文：'+(snippet(f.t,q)||'「'+esc(q)+'」を含む'))}})});
    if(score) out.push({x:x,score:score,why:why});
  });
  out.sort(function(a,b){return b.score-a.score});
  return out;
}
function resultsHtml(){
  var q=query.trim(); if(!q) return '';
  var rs=search(q);
  if(!rs.length) return '<p class="rhead">「'+esc(q)+'」は見つかりませんでした。別の言葉で試してください。</p>';
  return '<p class="rhead">「'+esc(q)+'」が出てくる講：'+rs.length+'件</p>'+rs.map(function(r){
    var l=r.x.l;
    return '<div class="hit"><a class="ht" href="#'+esc(l.id)+'"><small>'+esc(r.x.c.label+' '+r.x.c.title+'　'+l.label)+'</small>'+esc(l.title)+'</a>'+
      '<div class="why">'+r.why.slice(0,3).join('<br>')+'</div>'+(l.open?matButtons(l):'<p class="none">まだ公開されていません</p>')+'</div>'}).join('');
}

  if(edit) h+=editHead();
  var dt=new Date(), wd='日月火水木金土'.charAt(dt.getDay());
  h+='<header class="hero"><div class="hero-top"><span class="kicker">'+(dt.getMonth()+1)+'月'+dt.getDate()+'日（'+wd+'）</span><span class="jp">'+esc(c.title)+'<span class="seal" aria-hidden="true">史</span></span></div>'+
    '<h1 class="his" aria-label="History is his story"><span class="w1">His</span><span class="gap" aria-hidden="true"></span><span class="w2">Story</span></h1>'+
    '<div class="motto"><p class="ja">歴史は、だれかが語った「物語」</p></div>'+
    ((!edit&&prevVisit&&newSince)?'<p class="hello">前回から教材が <b>'+newSince+'件</b> 増えています</p>':'')+
    HERO_ART+'</header>';
  if(c.notice) h+='<div class="notice">'+esc(c.notice)+'</div>';
  return h;
}
/* ---------- 連絡事項 ---------- */
var newsAll=false, NEWS_SHOW=3;
function newsSorted(){return (state.news||[]).map(function(n,i){return {n:n,i:i}}).sort(function(a,b){return (b.n.date||'').localeCompare(a.n.date||'')||a.i-b.i})}
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'})}
function mdDate(s){var p=String(s||'').split('-');return p.length===3?(+p[1])+'/'+(+p[2]):''}
function newsView(){
  var list=newsSorted();
  if(!list.length) return '<section class="news" aria-label="連絡事項"><h2>連絡事項</h2><p class="nempty">現在、連絡事項はありません</p></section>';
  var shown=list;
  return '<section class="news" aria-label="連絡事項"><h2>連絡事項<small>'+list.length+'件</small></h2>'+shown.map(function(x){
    var n=x.n, isNew=n.date&&daysAgo(n.date)<=7&&daysAgo(n.date)>=0;
    return '<div class="nitem'+(n.important?' imp':'')+'"><time datetime="'+esc(n.date)+'">'+esc(mdDate(n.date))+'</time><div class="nt">'+(n.important?'<span class="tag imp">重要</span>':'')+(isNew?'<span class="tag new">NEW</span>':'')+'<span>'+esc(n.title||'')+'</span></div>'+
      (n.body?'<div class="nb">'+linkify(n.body)+'</div>':'')+'</div>'}).join('')+
    '</section>';
}
function newsEdit(){
  var list=newsSorted();
  return '<label class="lb">連絡事項（新しい日付が上に表示されます）</label><div class="erow"><button class="btn sm" data-act="add-news">＋ 連絡を追加</button></div>'+
    (list.length?list.map(function(x){var n=x.n,i=x.i;return '<div class="nedit"><div class="erow"><input id="nd-'+i+'" class="in narrow" type="date" data-n="'+i+'" data-nf="date" value="'+esc(n.date||'')+'" aria-label="日付" style="flex:0 0 10em">'+
      '<input id="nt-'+i+'" class="in grow" data-n="'+i+'" data-nf="title" value="'+esc(n.title||'')+'" placeholder="見出し（例：小テストの範囲）" aria-label="見出し"></div>'+
      '<textarea id="nb-'+i+'" class="in" rows="2" data-n="'+i+'" data-nf="body" placeholder="本文（空欄でもOK・URLはリンクになります）" aria-label="本文">'+esc(n.body||'')+'</textarea>'+
      '<div class="erow"><label class="chk"><input id="ni-'+i+'" type="checkbox" data-n="'+i+'" data-nf="important"'+(n.important?' checked':'')+'> 重要（色付きで表示）</label>'+delBtn('n'+i,'この連絡を削除')+'</div></div>'}).join(''):'<p class="nempty">まだ連絡はありません</p>');
}
function matButtons(l){
  var out=[];
  TYPES.forEach(function(t){
    var fs=files(l,t.k); if(!fs.length) return;
    if(hiddenT(l,t.k)){out.push('<span class="later">'+esc(t.s)+'（後日公開）</span>');return}
    fs.forEach(function(f){
      var cls=((S.seen[l.id+':'+t.k]?'seen':'')+(isNewFile(f)?' isnew':'')).trim();
      var lab=esc(fs.length>1?t.s+'：'+f.name:t.s), ttl=esc(l.title+'（'+(fs.length>1?f.name:t.name)+'）');
      if(f.file){var e2=(f.file.split('.').pop()||'').toLowerCase(), k2=e2==='docx'||e2==='doc'?'Word':e2==='pptx'||e2==='ppt'?'PowerPoint':e2==='pdf'?'PDF':'ファイル';
        out.push('<a class="mat'+(cls?' '+cls:'')+'" href="'+esc(f.file)+'" '+(e2==='pdf'?'target="_blank" rel="noopener"':'download="'+esc(f.fn||'')+'"')+' data-direct="1" data-seen="'+esc(l.id+':'+t.k)+'">'+lab+'<small>'+k2+(e2==='pdf'?'':' ↓')+'</small></a>');
      } else if(f.src&&f.src.assets){var ext=(f.src.fn.split('.').pop()||'').toLowerCase(), kind=ext==='docx'||ext==='doc'?'Word':ext==='pptx'||ext==='ppt'?'PowerPoint':ext==='pdf'?'PDF':ext==='xlsx'?'Excel':'ファイル';
        out.push('<button class="mat'+(cls?' '+cls:'')+'" data-dl="'+esc(f.src.assets.map(function(id){return '/_blob/'+id}).join('|'))+'" data-fn="'+esc(f.src.fn)+'" data-size="'+(f.src.size||0)+'" data-seen="'+esc(l.id+':'+t.k)+'" data-title="'+ttl+'" title="'+kind+'ファイルを保存">'+lab+'<small>'+kind+' ↓</small></button>');
      } else if(f.orig&&f.orig.parts){var isW=/\.docx$/i.test(f.orig.fn);
        out.push('<button class="mat'+(cls?' '+cls:'')+'" data-dl="'+esc(f.orig.parts.join('|'))+'" data-fn="'+esc(f.orig.fn)+'" data-size="'+(f.orig.size||0)+'" data-pdf="'+esc(f.href)+'" data-seen="'+esc(l.id+':'+t.k)+'" data-title="'+ttl+'" title="'+(isW?'Word':'PowerPoint')+'ファイルを保存">'+lab+'<small>'+(isW?'Word':'PowerPoint')+' ↓</small></button>');
      } else out.push('<a'+(cls?' class="'+cls+'"':'')+' href="'+esc(f.href)+'" '+tgt()+' data-seen="'+esc(l.id+':'+t.k)+'" data-title="'+ttl+'">'+lab+'</a>');
    });
  });
  return out.length?'<div class="mats">'+out.join('')+'</div>':'<p class="none">教材は準備中です</p>';
}

var SCALES=['世界','地域','国家','地方'];
function axX(y){y=Math.max(1500,Math.min(2026,y));return y<=1800?(y-1500)/300*25:25+(y-1800)/226*75}
function axisHtml(l){
  var a=l.axis; if(!a) return '';

  var yr=a.from===a.to?a.from+'年':a.from+'〜'+(a.to>=new Date().getFullYear()?'現在':a.to+'年');
  var pls=a.places||[];
  var dots=pls.map(function(p){var x=(p.lon+180),y=(80-p.lat)/138*150;return '<circle class="ring" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="17"/><circle class="dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9"><title>'+esc(p.n)+'</title></circle>'}).join('');

/* ---------- fit "His Story" to the banner width ---------- */
function fitHis(){
  var h=document.querySelector('.his'); if(!h) return;
  var w1=h.querySelector('.w1'), w2=h.querySelector('.w2'); if(!w1||!w2) return;
  h.style.fontSize='100px';
  var need=w1.getBoundingClientRect().width+w2.getBoundingClientRect().width+32, avail=h.clientWidth;
  if(!need||!avail) return;
  h.style.fontSize=Math.max(40,Math.min(220,Math.floor(100*avail/need*0.98)))+'px';
}

  if(!edit) h+=newsView();

  h+=nav();
  state.chapters.forEach(function(c,ci){
    h+='<section class="chap" id="'+esc(c.id)+'" style="--h:'+hue(ci)+'"><div class="chead"><span class="cbadge" aria-hidden="true">'+esc(cnum(c))+'</span><span class="cl">'+esc(c.label)+(c.era?'<span class="era">'+esc(c.era)+'</span>':'')+'</span><h2>'+esc(c.title)+'</h2></div>';

  });

  if(edit) h+='<div class="savebar"><span class="st" role="status">'+esc(status||(dirty?'未保存の変更があります':'変更はまだありません'))+'</span>'+
    '<button class="btn sm" data-act="edit-cancel">'+(dirty?'変更を破棄':'編集を終える')+'</button><button class="btn pri" data-act="save"'+(dirty&&!busy?'':' disabled')+'>保存して公開</button></div>';

function applyFilter(){
  if(edit) return;
  var searching=!!query.trim(), any=false;
  document.querySelectorAll('.chap').forEach(function(sec){
    var vis=0;
    sec.querySelectorAll('.lesson').forEach(function(a){var ok=!onlyHas||a.dataset.has==='1';a.hidden=!ok;if(ok)vis++});
    sec.hidden=searching||vis===0; if(vis)any=true;
  });
  var nr=document.getElementById('noresult'); if(nr) nr.hidden=searching||any;
}

var assetsNs=null, CHUNK=14000000;
function b64(buf){var u=new Uint8Array(buf),s='',i,step=0x8000;for(i=0;i<u.length;i+=step)s+=String.fromCharCode.apply(null,u.subarray(i,i+step));return btoa(s)}

var JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', zipLib=null, sampleNs=null;
function loadZip(){if(!zipLib)zipLib=loadScript(JSZIP).then(function(){if(!window.JSZip)throw new Error('zip');return window.JSZip});return zipLib}
function xmlRuns(xml,isPptx){
  var doc=new DOMParser().parseFromString(xml,'application/xml'), out=[];
  var ps=doc.getElementsByTagNameNS('*','p');
  for(var pi=0;pi<ps.length;pi++){
  if(ps[pi].getElementsByTagNameNS('*','p').length) continue;
  var rs=ps[pi].getElementsByTagNameNS('*','r');
  for(var i=0;i<rs.length;i++){
    var r=rs[i], t='', ts=r.getElementsByTagNameNS('*','t');
    for(var j=0;j<ts.length;j++) t+=ts[j].textContent;
    if(!t) continue;
    var col=null, cs=r.getElementsByTagNameNS('*',isPptx?'srgbClr':'color');
    if(cs.length) col=(cs[0].getAttribute(isPptx?'val':'w:val')||cs[0].getAttribute('val')||'').toUpperCase();
    var hl=!isPptx&&r.getElementsByTagNameNS('*','highlight').length>0;
    out.push({t:t,c:col,h:hl});
  }
  out.push({t:'\n',c:null});
  }
  return out;
}
function isMarked(run,isPptx){
  var c=run.c; if(run.h) return true; if(!c||c==='AUTO') return false;
  var r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  if(isNaN(r)) return false;
  var gray=Math.max(r,g,b)-Math.min(r,g,b)<24;
  if(isPptx) return !gray;                 // スライド：白黒以外の色＝強調語
  return !gray||r>230&&g>230&&b>230;       // プリント：色付き・白字（隠し解答）＝用語
}
var TERM_TAIL=/(条約|戦争|事件|運動|革命|会議|宣言|同盟|協定|協商|政策|体制|主義|改革|制度|令|法|変|乱|朝|帝国|政府|内閣|憲法|議会|博覧会|使節団|講和|併合|恐慌|独立|維新)$/;
function heuristicTerms(runs,isPptx){
  var cand=[], cur='';
  runs.forEach(function(r){ if(isMarked(r,isPptx)) cur+=r.t; else { if(cur) cand.push(cur); cur=''; } }); if(cur) cand.push(cur);
  var text=runs.map(function(r){return r.t}).join('');
  (text.match(/[一-龥々ヶ・＝ァ-ヴー]{2,14}/g)||[]).forEach(function(w){ if(TERM_TAIL.test(w)) cand.push(w) });
  var seen={}, out=[];
  var GENERIC={'制度':1,'改革':1,'運動':1,'政変':1,'反乱':1,'帝政':1,'皇帝':1,'列強':1,'日本':1,'アジア':1,'アフリカ':1,'アメリカ':1,'ヨーロッパ':1,'イギリス':1,'フランス':1,'ドイツ':1,'ロシア':1,'中国':1,'女性':1,'インフレ':1,'政府':1,'戦争':1,'革命':1,'同盟国':1,'連合国':1};
  cand.forEach(function(w){w=w.replace(/[〇◯○●◎□■☆★]/g,'').replace(/[\s　]+/g,' ').trim(); if(/\n/.test(w)) return; w=w.replace(/[\s　（）()「」『』・…:：、。,.!！?？→⇒⇩↓]+$/,'').replace(/^[\s　（）()「」『』・…:：、。,.①-⑳❶-❿]+/,'').trim();
    if(w.length<2||w.length>20||/[0-9０-９]/.test(w)||/[。]/.test(w)||GENERIC[w]||TERM_TAIL.test(w)&&w.replace(TERM_TAIL,'').length<1||/[なにをがはのでとも]$/.test(w)) return;
    if(!seen[w]){seen[w]=1;out.push(w)} });
  return out;
}
function extractFromFile(buf,fn){
  var ext=(fn.split('.').pop()||'').toLowerCase();
  if(ext!=='docx'&&ext!=='pptx') return Promise.resolve(null);
  var isPptx=ext==='pptx';
  return loadZip().then(function(Z){return Z.loadAsync(buf)}).then(function(z){
    var names=Object.keys(z.files).filter(function(n){return isPptx?/^ppt\/slides\/slide\d+\.xml$/.test(n):n==='word/document.xml'})
      .sort(function(a,b){return (parseInt(a.replace(/\D/g,''))||0)-(parseInt(b.replace(/\D/g,''))||0)});
    return Promise.all(names.map(function(n){return z.file(n).async('string')}));
  }).then(function(xmls){
    var runs=[]; xmls.forEach(function(x){runs=runs.concat(xmlRuns(x,isPptx)); runs.push({t:'\n',c:null})});
    var text=runs.map(function(r){return r.t}).join('').replace(/[ \t\u3000]+/g,' ').replace(/\n\s*/g,'\n').trim();
    var terms=heuristicTerms(runs,isPptx);
    if(!sampleNs) return {text:text,terms:terms.slice(0,40)};
    var prompt='次は高校「歴史総合」の授業'+(isPptx?'スライド':'プリント')+'の本文です。生徒が覚えるべき歴史用語（人名・事件・戦争・条約・制度・政策・団体・地名など）を、本文に出てくる表記のまま、授業で出てくる順に最大30個選んでください。一般的な言葉（例：日本、政府、問題）や文章は含めないこと。JSONの文字列配列だけを返してください。\n\n参考（強調表示されていた語）：'+terms.slice(0,60).join('、')+'\n\n本文：\n'+text.slice(0,24000);
    return sampleNs.json(prompt,{modelTier:'quick'}).then(function(arr){
      var flat=text.replace(/\s/g,'');
      var got=(Array.isArray(arr)?arr:[]).filter(function(w){return typeof w==='string'&&w.length>=2&&w.length<=20&&flat.indexOf(w.replace(/\s/g,''))>=0});
      return {text:text,terms:got.length?got:terms.slice(0,40)};
    }).catch(function(){return {text:text,terms:terms.slice(0,40)}});
  }).catch(function(){return null});
}
function mergeTerms(l,ws){l.terms=l.terms||[];var seen={};l.terms.forEach(function(w){seen[w]=1});ws.forEach(function(w){if(!seen[w]){seen[w]=1;l.terms.push(w)}});}

function uploadFiles(list,ci,li,tk){
  if(!assetsNs){toast('この画面ではファイルを添付できません');return}
  var files=Array.prototype.slice.call(list||[]); if(!files.length) return;
  var l=state.chapters[ci]&&state.chapters[ci].lessons[li]; if(!l) return;
  var chain=Promise.resolve(), done=0, termsAdded=0;
  files.forEach(function(file){chain=chain.then(function(){
    status='「'+file.name+'」をアップロードしています…'; render();
    return file.arrayBuffer().then(function(buf){
      var t=b64(buf), parts=[]; for(var i=0;i<t.length;i+=CHUNK) parts.push(t.slice(i,i+CHUNK));
      var ids=[], c2=Promise.resolve();
      parts.forEach(function(pt){c2=c2.then(function(){return assetsNs.upload(new Blob([pt],{type:'text/plain'}),{type:'text/plain'}).then(function(r){ids.push(r.id)})})});
      return c2.then(function(){
        var item={name:file.name.replace(/\.[^.]+$/,''),d:TODAY,src:{assets:ids,fn:file.name,size:file.size}};
        l.items=l.items||{}; (l.items[tk]=l.items[tk]||[]).push(item);
        done++; dirty=true;
        status='「'+file.name+'」から用語を抜き出しています…'; render();
        return extractFromFile(buf,file.name).then(function(r){ if(r){ if(r.text) item.t=r.text.slice(0,20000); if(r.terms&&r.terms.length){mergeTerms(l,r.terms);termsAdded+=r.terms.length} } });
      });
    }).catch(function(e){var c=e&&e.code;status='「'+file.name+'」を添付できませんでした（'+(c==='quota_exceeded'?'保存容量の上限です':c==='too_large'?'ファイルが大きすぎます':(c||'エラー'))+'）';render();throw e});
  })});
  chain.then(function(){status=done+'件のファイルを添付しました'+(termsAdded?'（用語を'+termsAdded+'個抽出。下の「用語」欄で確認・修正できます）':'')+'。「保存して公開」で生徒に表示されます';expanded['e'+ci+'-'+li+'-'+tk]=true;render()}).catch(function(){});
}
function saveOrig(parts,fn,size){
  if(!dlNs){toast('この画面では保存できません');return}
  toast('準備しています…'+(size>3e6?'（'+Math.round(size/1e6)+'MB）':''));
  Promise.all(parts.map(function(h){return fetch(h).then(function(r){if(!r.ok)throw {code:'http'};return r.text()})})).then(function(ts){
    var bin=atob(ts.join('').replace(/\s+/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return dlNs.save({filename:fn,data:new Blob([u])})})
  .then(function(){toast('保存しました')}).catch(function(e){
    var c=e&&e.code;
    if(c==='declined'){toast('保存をキャンセルしました');return}
    if(c==='rate_limited'){toast('少し待ってからもう一度押してください');return}
    if(c==='unavailable'||c==='not_granted'||c==='capability_disabled'||c==='extension_not_enabled'){dlNs=null;render();toast('この画面ではファイルを保存できません');return}
    toast('保存できませんでした。通信状況を確認してください');
  });
}

var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var libPromise=null, viewerToken=0;
function loadScript(src){return new Promise(function(res,rej){var sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=function(){rej(new Error('load'))};document.head.appendChild(sc)})}
function loadPdfLib(){
  if(!libPromise) libPromise=loadScript(PDFJS+'pdf.worker.min.js').then(function(){return loadScript(PDFJS+'pdf.min.js')}).then(function(){
    var lib=window.pdfjsLib; if(!lib) throw new Error('nolib'); return lib});
  return libPromise;
}
function closeViewer(){viewerToken++;var v=document.getElementById('viewer');if(v)v.remove();document.body.style.overflow=''}
function openPdf(href,title){
  closeViewer(); var tok=++viewerToken;
  var v=document.createElement('div'); v.id='viewer'; v.className='viewer'; v.setAttribute('role','dialog'); v.setAttribute('aria-label',title||'プリント');
  v.innerHTML='<div class="vbar"><strong>'+esc(title||'プリント')+'</strong><span id="vinfo"></span><button class="vzoom" id="vout" aria-label="縮小">－</button><button class="vzoom" id="vin" aria-label="拡大">＋</button><button class="vclose" id="vclose">閉じる</button></div><div class="vpages" id="vpages"><p class="vmsg">読み込み中…</p></div>';
  document.body.appendChild(v); document.body.style.overflow='hidden';
  document.getElementById('vclose').addEventListener('click',closeViewer);
  var Z=[1,1.5,2,2.5], zi=0;
  function setZ(d){zi=Math.max(0,Math.min(Z.length-1,zi+d));document.getElementById('vpages').style.setProperty('--z',Z[zi])}
  document.getElementById('vin').addEventListener('click',function(){setZ(1)});
  document.getElementById('vout').addEventListener('click',function(){setZ(-1)});
  var box=document.getElementById('vpages');
  Promise.all([loadPdfLib(),fetch(href).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer()})]).then(function(x){
    if(tok!==viewerToken) return;
    return x[0].getDocument({data:new Uint8Array(x[1]),isEvalSupported:false}).promise.then(function(pdf){
      if(tok!==viewerToken) return;
      box.innerHTML=''; document.getElementById('vinfo').textContent=pdf.numPages+'ページ';
      var w=Math.min(box.clientWidth-32,820), dpr=Math.min(window.devicePixelRatio||1,2.5), chain=Promise.resolve();
      for(var i=1;i<=pdf.numPages;i++)(function(n){chain=chain.then(function(){
        if(tok!==viewerToken) return;
        return pdf.getPage(n).then(function(pg){
          var base=pg.getViewport({scale:1}), sc=w/base.width, vp=pg.getViewport({scale:Math.min(sc*dpr*2,2400/base.width)});
          var cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height); cv.setAttribute('aria-label',n+'ページ目');
          box.appendChild(cv);
          return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        });
      })})(i);
      return chain;
    });
  }).catch(function(){
    if(tok!==viewerToken) return;
    box.innerHTML='<p class="vmsg">プリントを表示できませんでした。通信状況を確認して、もう一度開いてください。</p>';
  });
}

      var url=(u.value||'').trim(), name=(n.value||'').trim();
      if(!/^https?:\/\//i.test(url)){status='URLは https:// から始まる形で入力してください';render();return}
      l.items=l.items||{}; (l.items[ds.t]=l.items[ds.t]||[]).push({name:name||TYPES.filter(function(t){return t.k===ds.t})[0].s,href:url,d:TODAY});
      expanded['e'+q]=true; return touch();
    }
    case 'del':{
      if(pendingDel!==ds.key){pendingDel=ds.key;render();return}
      pendingDel=null; var k=ds.key;
      if(k[0]==='n'){state.news.splice(+k.slice(1),1)}
      else if(k[0]==='c'){state.chapters.splice(+k.slice(1),1)}
      else{var pr=k.slice(1).split('-');var dl=state.chapters[+pr[0]].lessons.splice(+pr[1],1)[0];if(dl&&state.current===dl.id)state.current=null}
      return touch();
    }
  }
});
function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;touch()}
function clearDraft(){try{sessionStorage.removeItem(DRAFT_KEY)}catch(e){}}

/* ---------- save (republish this page) ---------- */
function buildDoc(s){
  var hs=document.head&&document.head.querySelector('style');
  var reset=(hs&&hs.textContent)||DEFAULT_RESET;
  var css=document.getElementById('css').textContent;
  var js=document.getElementById('main').textContent;
  var json=JSON.stringify(s,null,1).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(PAGE_TITLE)+'</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="'+FONT_HREF+'">\n'+
    '<style id="css">'+css+'</style>\n<div id="app"><p style="padding:40px 0;text-align:center">読み込み中…</p></div>\n'+
    '<script type="application/json" id="site-data">'+json+'<\/script>\n<script id="main">'+js+'<\/script>\n</body></html>';
}
function save(){
  if(busy||!dirty) return;
  if(!art){status='この画面では保存できません（編集権限のある画面で開いてください）';render();return}
  busy=true; status='保存しています…'; render();
  var next=clone(state); next.updated=TODAY;
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(next))}catch(e){}
  art.publish(buildDoc(next)).then(function(){clearDraft()}).catch(function(err){
    busy=false; var code=err&&err.code;
    if(code==='conflict'){status='ほかの場所で更新されたため最新版を読み込みます。編集内容は復元できます。';render();return}
    clearDraft();
    if(code==='not_writer'||code==='not_granted'){canWrite=false;edit=false;status='';render();return}
    status='保存できませんでした（'+(code||'エラー')+'）。少し待ってからもう一度お試しください。';render();
  });
}

/* ---------- boot ---------- */
render();
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(ns){art=ns}).catch(function(){});
  window.claude.use('downloads').then(function(ns){if(ns){dlNs=ns;render()}}).catch(function(){});
  window.claude.use('assets').then(function(ns){if(ns){assetsNs=ns;if(edit)render()}}).catch(function(){});
  window.claude.use('sample').then(function(ns){if(ns)sampleNs=ns}).catch(function(){});
  window.claude.use('user').then(function(u){
    if(!u) return;
    return Promise.all([u.isOwner(),u.canEdit()]).then(function(r){canWrite=!!(r[0]||r[1]);if(canWrite)render()});
  }).catch(function(){});
}
})();
</script>
